[mcp_servers."swarmui-workflows"]
command = "node"
args = ["integrations/workflow-mcp/src/index.js"]
cwd = "."
env = { SWARMUI_REPO_ROOT = ".", SWARMUI_MCP_ALLOW_WRITES = "false" }
enabled = true
required = false
startup_timeout_sec = 15
tool_timeout_sec = 120
default_tools_approval_mode = "writes"

[mcp_servers."swarmui-workflows".tools.queue_workflow]
approval_mode = "prompt"

[mcp_servers."swarmui-workflows".tools.cancel_workflow]
approval_mode = "prompt"
